[project]
name = "voice-morpher"
version = "0.1.0"
description = "Local-first voice conversion MVP for Apple Silicon"
readme = "README.md"
license = "MIT"
authors = [
    { name = "彩旗工作室（SK Studio）", email = "developer@skstudio.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.15.2",
    "huggingface-hub>=1.17.0",
    "librosa>=0.11.0",
    "modelscope>=1.37.1",
    "numpy>=2.4.6",
    "pydantic-settings>=2.14.1",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["backends", "core", "services", "ui"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
